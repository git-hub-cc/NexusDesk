<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="native-menu.css"><style>
html,body{margin:0;width:100%;height:100%;overflow-x:hidden;overflow-y:auto;background:var(--ide-bg,#2b2d30);color-scheme:dark}
</style><body><script>
let request = null;
let lastHeight = 0;
let lastHtml = null;
let passiveMenu = false;
let resizeTimer = null;
const navigate=(kind,path,values={})=>{location.href='noteide-menu://'+kind+'/'+path+'?'+new URLSearchParams({...values,request})};
const send=(id,value)=>navigate('action',encodeURIComponent(id),value===undefined?{}:{value});
const notifyResize=()=>{
  resizeTimer=null;
  if(passiveMenu)return;
  const menu=document.querySelector('.native-menu');
  if(menu&&request){
    const height=Math.ceil(menu.getBoundingClientRect().height);
    if(height!==lastHeight){lastHeight=height;navigate('resize',height);}
  }
};
const queueResize=()=>{
  if(!passiveMenu&&resizeTimer===null)resizeTimer=setTimeout(notifyResize,50);
};
const observer=new ResizeObserver(queueResize);
// Retain the scroll container and surviving rows across suggestion updates.
const updateSuggestions=(previous,content)=>{
  const menu=previous.querySelector('.native-menu');
  const list=menu.querySelector('[role=listbox]');
  const nextList=content.querySelector('[role=listbox]');
  if(!list||!nextList)return false;
  const scrollTop=menu.scrollTop;
  const rows=new Map([...list.children].map(row=>[row.dataset.action,row]));
  const positions=new Map([...rows].map(([key,row])=>[key,row.getBoundingClientRect().top]));
  const nextRows=[...nextList.children].map(next=>{
    const row=rows.get(next.dataset.action);
    if(!row)return next;
    row.className=next.className;
    row.id=next.id;
    row.setAttribute('aria-selected',next.getAttribute('aria-selected'));
    // Titles can change while history is being updated.
    const title=row.querySelector('span>span');
    if(title)title.textContent=next.querySelector('span>span').textContent;
    return row;
  });
  list.replaceChildren(...nextRows);
  const nextMenu=content.querySelector('.native-menu');
  // Refresh the heading and empty-state message without replacing the list.
  [...menu.children].filter(node=>node!==list).forEach(node=>node.remove());
  for(const node of [...nextMenu.children]){
    if(node===nextList)continue;
    if(node.compareDocumentPosition(nextList)&Node.DOCUMENT_POSITION_FOLLOWING)menu.insertBefore(node,list);
    else menu.append(node);
  }
  menu.scrollTop=scrollTop; // Browser clamps only when the remaining list is shorter.
  for(const row of nextRows){
    const before=positions.get(row.dataset.action);
    row.getAnimations().forEach(animation=>animation.cancel());
    const after=row.getBoundingClientRect().top;
    if(before!==undefined&&before!==after&&!matchMedia('(prefers-reduced-motion: reduce)').matches)
      row.animate([{transform:`translateY(${before-after}px)`},{transform:'translateY(0)'}],{duration:160,easing:'ease-out'});
  }
  return true;
};
window.__setMenu=(html,nextRequest,passive=false)=>{
  const updating=request===nextRequest;
  if(updating&&html===lastHtml)return;
  observer.disconnect();
  clearTimeout(resizeTimer);
  resizeTimer=null;
  const previous=document.querySelector('#menu-content');
  const scrollTop=previous?.querySelector('.native-menu')?.scrollTop||0;
  const content=document.createElement('div');
  content.id='menu-content';
  content.style.display='contents';
  content.innerHTML=html;
  if(updating&&passive&&updateSuggestions(previous,content)){lastHtml=html;return;}
  if(previous)previous.replaceWith(content);else document.body.prepend(content);
  request=nextRequest;
  lastHtml=html;
  passiveMenu=passive;
  const menu=content.querySelector('.native-menu');
  if(menu){
    const height=Math.ceil(menu.getBoundingClientRect().height);
    const resized=height!==lastHeight;
    if(!updating)lastHeight=height;
    if(updating)menu.scrollTop=scrollTop;
    if(!passive)content.querySelector('button:not(:disabled)')?.focus();
    if(!updating)navigate('ready',height);else if(!passive&&resized)queueResize();
    if(!passive)observer.observe(menu);
  }
};
if(window.__pendingMenu){window.__setMenu(...window.__pendingMenu);delete window.__pendingMenu;}
// Suggestions are serialized HTML: React's mouse handlers do not survive here.
// Dispatch before a focus change can blur the address field and close the session.
document.addEventListener('pointerdown',event=>{if(!passiveMenu||event.button!==0)return;const target=event.target;const button=target.closest('button[data-action]');if(button&&!button.disabled){event.preventDefault();event.stopPropagation();send(button.dataset.action,button.dataset.value);return}const option=target.closest('[role=option][data-action]');if(option&&!option.disabled){event.preventDefault();send(option.dataset.action,option.dataset.value)}});
document.addEventListener('mousedown',event=>{if(passiveMenu)event.preventDefault()});
document.addEventListener('click',event=>{if(passiveMenu&&event.detail!==0)return;const sub=event.target.closest('.submenu-trigger');if(sub){sub.parentElement.classList.toggle('open');return}const button=event.target.closest('[data-action]');if(button&&!button.disabled)send(button.dataset.action,button.dataset.value)});
document.addEventListener('change',event=>{if(event.target.matches('input[data-action]'))send(event.target.dataset.action,event.target.value)});
document.addEventListener('contextmenu',event=>event.preventDefault());
document.addEventListener('keydown',event=>{if(event.key==='Escape'){send('close');return}if(event.key==='ArrowRight'&&document.activeElement?.matches('.submenu-trigger')){document.activeElement.parentElement.classList.add('open');document.activeElement.parentElement.querySelector('.submenu-content button')?.focus();return}if(event.key==='ArrowLeft'){const sub=document.activeElement?.closest('.submenu');sub?.classList.remove('open');sub?.querySelector('.submenu-trigger')?.focus();return}const buttons=[...document.querySelectorAll('button:not(:disabled),input')].filter(node=>node.offsetParent!==null);let index=buttons.indexOf(document.activeElement);if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();buttons[(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()}if(event.key==='Home')buttons[0]?.focus();if(event.key==='End')buttons.at(-1)?.focus()});
document.querySelector('button:not(:disabled)')?.focus();
</script></body></html>
