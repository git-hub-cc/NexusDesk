<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 桌面应用底层背景渐变 (匹配 NexusDesk 的暗黑主题) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2d30" />
      <stop offset="100%" stop-color="#1e1f22" />
    </linearGradient>

    <!-- 右侧立柱切面渐变 (底层/暗部) -->
    <linearGradient id="gRightA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gRightB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- 中间对角线切面渐变 (中层) -->
    <linearGradient id="gDiagA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gDiagB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 左侧立柱切面渐变 (顶层/亮部) -->
    <linearGradient id="gLeftA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gLeftB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 物理空间投影 (Drop Shadows) -->
    <filter id="shadowDiag" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="shadowLeft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 图标底板 (圆角矩形，含细腻边框) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#45484d" stroke-width="3" />

  <!-- 折纸 N 核心结构 (加入半透明白色描边，模拟纸张切割高光边缘) -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linejoin="round">
    
    <!-- 1. Right Leg (底层背板) -->
    <g id="right-leg">
       <polygon points="324,100 420,100 420,412" fill="url(#gRightA)" />
       <polygon points="324,100 420,412 324,412" fill="url(#gRightB)" />
    </g>

    <!-- 2. Diagonal (中层折叠，向左下投射阴影) -->
    <g id="diagonal" filter="url(#shadowDiag)">
       <polygon points="92,100 188,100 420,412" fill="url(#gDiagA)" />
       <polygon points="92,100 420,412 324,412" fill="url(#gDiagB)" />
    </g>

    <!-- 3. Left Leg (顶层折叠，向右下投射深邃阴影) -->
    <g id="left-leg" filter="url(#shadowLeft)">
       <polygon points="92,100 188,100 188,412" fill="url(#gLeftA)" />
       <polygon points="92,100 188,412 92,412" fill="url(#gLeftB)" />
    </g>
    
  </g>
</svg>